<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    <div class="container content">
      <header class="masthead">
        <h3 class="masthead-title">
          <a href="{{ '/' | relative_url }}" title="Home">{{ site.title }}</a>
          <small>{{ site.tagline }}</small>
        </h3>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Posts</a>
          <a href="{{ '/archive/' | relative_url }}">Archive</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </header>
      <main>{{ content }}</main>
      <footer class="footer">
        <small>&copy; <time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: '%Y' }}</time> {{ site.author.name }}. Built with Jekyll and Poole.</small>
      </footer>
    </div>
  </body>
</html>
